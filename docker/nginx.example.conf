# Пример конфига nginx на хосте (не в Docker).
# /etc/nginx/sites-available/geekspro-control
# После установки: certbot --nginx -d control.example.com

server {
    listen 80;
    server_name control.example.com;

    client_max_body_size 25m;

    location /static/ {
        alias /opt/GeeksProControl/app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /opt/GeeksProControl/app/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
