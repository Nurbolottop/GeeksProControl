<tr id="score-{{ row.intern.pk }}">
    <td>
        <a href="{{ row.intern.get_absolute_url }}"><strong>{{ row.intern.full_name }}</strong></a>
        <div style="font-size:11.5px; color: var(--text-muted)">
            {{ row.intern.specialization|default:'' }}
        </div>
    </td>
    <td>
        <div class="score-scale">
            {% for value in scale %}
                <button type="button"
                        class="score-btn {% if row.score == value %}is-on score-btn--{% if value >= 8 %}high{% elif value >= 5 %}mid{% else %}low{% endif %}{% endif %}"
                        hx-post="{% url 'attendance:score_person' meeting.pk %}"
                        hx-vals='{"intern": "{{ row.intern.pk }}", "score": "{% if row.score == value %}clear{% else %}{{ value }}{% endif %}"}'
                        hx-target="#score-{{ row.intern.pk }}" hx-swap="outerHTML">{{ value }}</button>
            {% endfor %}
        </div>
    </td>
    <td style="min-width: 220px">
        <input type="text" class="score-note" placeholder="за что балл"
               value="{{ row.score_comment }}" maxlength="255"
               hx-post="{% url 'attendance:score_person' meeting.pk %}"
               hx-trigger="change"
               hx-include="this"
               hx-vals='{"intern": "{{ row.intern.pk }}"}'
               name="comment"
               hx-target="#score-{{ row.intern.pk }}" hx-swap="outerHTML">
    </td>
</tr>
