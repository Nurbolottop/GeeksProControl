{# Один вопрос анкеты — отдельная карточка, как в гугл-формах #}
<div class="gcard gcard--q {% if field.errors %}is-error{% endif %}">
    <label class="gq__title" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="gq__req">*</span>{% endif %}
    </label>
    {% if field.help_text %}<div class="gq__hint">{{ field.help_text }}</div>{% endif %}
    <div class="gq__control">{{ field }}</div>
    {% if field.errors %}<div class="gq__error">{{ field.errors.0 }}</div>{% endif %}
</div>
