{# Вопрос-галочка: текст справа от чекбокса #}
<div class="gcard gcard--q {% if field.errors %}is-error{% endif %}">
    <label class="gcheck">
        {{ field }}
        <span>
            {{ field.label }}{% if field.field.required %}<span class="gq__req">*</span>{% endif %}
            {% if field.help_text %}<em>{{ field.help_text }}</em>{% endif %}
        </span>
    </label>
    {% if field.errors %}<div class="gq__error">{{ field.errors.0 }}</div>{% endif %}
</div>
