<tr id="stage-{{ stage.pk }}">
    <td colspan="8">
        <form hx-post="{% url 'projects:stage_update' stage.pk %}"
              hx-target="#stage-{{ stage.pk }}"
              hx-swap="outerHTML"
              style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; padding: 4px 0;">
            <strong style="min-width: 130px">{{ stage.get_key_display }}</strong>
            <div class="form-field">
                <label>Статус</label>
                {{ form.status }}
            </div>
            <div class="form-field" style="max-width: 90px">
                <label>Прогресс, %</label>
                {{ form.progress }}
            </div>
            <div class="form-field">
                <label>Deadline</label>
                {{ form.deadline }}
            </div>
            <div class="form-field">
                <label>Ответственный</label>
                {{ form.responsible }}
            </div>
            <div class="form-field" style="flex:1; min-width: 160px">
                <label>Комментарий</label>
                {{ form.comment }}
            </div>
            <button type="submit" class="btn btn--sm">Сохранить</button>
        </form>
    </td>
</tr>
