{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — GeeksPro Control</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>Geeks<span style="color:#2563eb">Pro</span> Control</h1>
        <p class="sub">Система управления проектами</p>
        {% if form.non_field_errors %}
            <div class="message message--error">Неверный логин или пароль.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-field">
                <label for="id_username">Логин</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="form-field">
                <label for="id_password">Пароль</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn">Войти</button>
        </form>
    </div>
</div>
</body>
</html>
